    description: 'Converts Leica LIF files into mikro datasets natively, one per image
      (one per tile for a tile scan), with Leica''s own metadata: sequential settings,
      detectors, laser lines, pinhole, display windows and stage positions.'
    implementations:
    - codeHash: 64d143f5ddf93ed116649e51ef9efbb5b7aab3642ac15f76ae7ccf0d7b647ae2
      definition:
        allowProbe: false
        args:
        - effects: []
          identifier: '@mikro/file'
          key: file
          kind: STRUCTURE
          nullable: false
          validators: []
          widget:
            dependencies: []
            kind: SEARCH
            query: "query SearchFiles($search: String, $values: [ID!], $limit: Int,\
              \ $offset: Int = 0) {\n  options: files(\n    filters: { search: $search,\
              \ ids: $values }\n    pagination: { limit: $limit, offset: $offset }\n\
              \  ) {\n    value: id\n    label: name\n    __typename\n  }\n}"
            ward: mikro
        - default: 0
          effects: []
