          key: method
          kind: STRING
          nullable: true
          validators: []
        - default: true
          effects: []
          key: stage_scene
          kind: BOOL
          nullable: true
          validators: []
        - default: ''
          effects: []
          key: world_name
          kind: STRING
          nullable: true
          validators: []
        catalogs: []
        collections:
        - conversion
        description: "Read a Leica LIF file natively (no Bio-Formats) and upload every\
          \ image as a pyramided dataset \u2014 every tile, for a tile scan \u2014\
          \ with Leica's own metadata: sequential settings, detectors, laser lines,\
          \ pinhole and display windows, placed in a shared micrometer space at its\
          \ stage position and staged in a scene of its own. Tiles whose merged image\
          \ is in the file are uploaded but not staged."
        idempotent: false
